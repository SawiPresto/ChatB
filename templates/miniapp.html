<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='miniapp.css') }}">
</head>
<body>
    <main class="battle-app">
        <section id="battle-scene" class="battle-scene">
            <div class="scene-bg" id="scene-bg"></div>
            <div class="scene-vignette"></div>

            <header class="hud-top">
                <div class="hero-chip">
                    <img id="player-avatar" class="avatar-dot" alt="Avatar">
                    <div>
                        <div class="chip-title">LEVEL <span id="level-value">1</span></div>
                        <div class="chip-sub" id="player-name">Player</div>
                        <div class="chip-mini-progress"><i id="level-progress-bar"></i></div>
                    </div>
                </div>
                <div class="coin-chip">🪙 <span id="coin-value">0</span></div>
            </header>

            <div class="enemy-hud">
                <div class="enemy-name"><span id="enemy-name">Enemy Scout</span> (Lv <span id="enemy-level">1</span>)</div>
                <div class="enemy-bar"><i id="enemy-hp-bar"></i></div>
                <div class="enemy-hp-text">HP <span id="enemy-hp-value">100/100</span></div>
            </div>

            <div class="bar-stack">
                <div class="bar-wrap">
                    <span>ENERGY</span>
                    <div class="bar"><i id="energy-bar"></i></div>
                    <b id="energy-value">0/0</b>
                </div>
                <div class="bar-wrap">
                    <span>TAP POWER</span>
                    <div class="bar blue"><i id="tap-bar"></i></div>
                    <b id="tap-value">0</b>
                </div>
            </div>

            <div class="arena">
                <div class="fighter player" id="player-fighter">
                    <img id="char-base-img" class="fighter-layer" alt="Hero base">
                    <img id="char-skin-img" class="fighter-layer" alt="Hero skin">
                    <img id="char-weapon-img" class="fighter-layer weapon-layer" alt="Hero weapon">
                    <img id="char-pet-img" class="fighter-layer pet-layer" alt="Hero pet">
                    <div id="char-fallback" class="fallback-hero"></div>
                </div>

                <div class="slash fx" id="slash-fx"></div>
                <div class="hit fx" id="hit-fx"></div>
                <div id="damage-layer" class="damage-layer"></div>

                <div class="fighter enemy" id="enemy-fighter">
                    <img id="enemy-base-img" class="fighter-layer enemy-layer" alt="Enemy">
                    <div id="enemy-fallback" class="fallback-enemy"></div>
                </div>
            </div>

            <footer class="skill-bar">
                <button id="tap-btn" class="skill main">Attack</button>
                <button id="upgrade-btn" class="skill">Info Lv</button>
                <button id="inventory-btn" class="skill">Armory</button>
                <button id="leaderboard-btn" class="skill">Rank</button>
                <button id="refresh-btn" class="skill ghost">Sync</button>
            </footer>
        </section>

        <section id="inventory-panel" class="overlay-panel hidden">
            <div class="panel-head">
                <h2>Armory & Equipment</h2>
                <button id="close-inventory" class="close-btn">Tutup</button>
            </div>
            <div class="loadout">
                <div><span>Weapon</span><strong id="weapon-slot">None</strong></div>
                <div><span>Pet</span><strong id="pet-slot">None</strong></div>
                <div><span>Skin</span><strong id="skin-slot">None</strong></div>
            </div>
            <div id="shop-grid" class="shop-grid"></div>
        </section>

        <section id="leaderboard-panel" class="overlay-panel hidden">
            <div class="panel-head">
                <h2>Leaderboard</h2>
                <button id="close-leaderboard" class="close-btn">Tutup</button>
            </div>
            <ol id="leaderboard-list" class="leaderboard"></ol>
        </section>

        <p id="status-text" class="status">Menyiapkan arena...</p>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='miniapp.js') }}"></script>
</body>
</html>
