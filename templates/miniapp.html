<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='miniapp.css') }}">
</head>
<body>
    <main class="app">
        <header class="panel hero">
            <div>
                <h1 id="game-title">{{ game_name }}</h1>
                <p class="muted">Cyber cabage rogue run. Build, gear, conquer.</p>
            </div>
            <div class="hero-badge">Mini App</div>
        </header>

        <section class="grid">
            <div class="panel character-panel">
                <h2>Karakter</h2>
                <div class="character-stage">
                    <div class="char-glow"></div>
                    <div class="char-cat" id="char-fallback">
                        <div class="cat-ears"></div>
                        <div class="cat-face"></div>
                        <div class="cat-weapon weapon-none" id="weapon-visual"></div>
                    </div>
                    <div class="char-art" id="char-art">
                        <img id="char-base-img" class="char-layer" alt="Character base">
                        <img id="char-skin-img" class="char-layer" alt="Character skin">
                        <img id="char-weapon-img" class="char-layer" alt="Character weapon">
                        <img id="char-pet-img" class="char-layer pet-layer" alt="Character pet">
                    </div>
                </div>
                <div class="loadout">
                    <div><span>Weapon</span><strong id="weapon-slot">None</strong></div>
                    <div><span>Pet</span><strong id="pet-slot">None</strong></div>
                    <div><span>Skin</span><strong id="skin-slot">None</strong></div>
                </div>
            </div>

            <div class="panel stats">
                <h2>Stat</h2>
                <div class="stat-list">
                    <div><span class="label">Level</span><strong id="level-value">1</strong></div>
                    <div><span class="label">SawiCoin</span><strong id="coin-value">0</strong></div>
                    <div><span class="label">Tap Power</span><strong id="tap-value">1</strong></div>
                    <div><span class="label">Energy</span><strong id="energy-value">0/0</strong></div>
                </div>
                <div class="actions">
                    <button id="tap-btn" class="btn primary">Attack / Tap</button>
                    <button id="upgrade-btn" class="btn">Level Upgrade</button>
                    <button id="refresh-btn" class="btn ghost">Refresh</button>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>Armory & Items</h2>
            <div id="shop-grid" class="shop-grid"></div>
        </section>

        <section class="panel">
            <h2>Leaderboard</h2>
            <ol id="leaderboard-list" class="leaderboard"></ol>
        </section>

        <p id="status-text" class="status"></p>
    </main>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='miniapp.js') }}"></script>
</body>
</html>
